version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Subscribe and Replay share the Event message intentionally.
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_RESPONSE_STANDARD_NAME
    # `BotService` would generate `BotServiceServiceImplementation` via ts-proto.
    - SERVICE_SUFFIX
breaking:
  use:
    - FILE
